; PlatformIO project for the CYD (ESP32-2432S028R, 2.8" resistive touch, dual-USB).
; A home dashboard with two build profiles, one per physical display:
;   cyd-solar : clock (+ house battery/load row), forecast, Solar, Tesla, HVAC, status
;   cyd-fish  : clock, forecast, 2x Tank Temps, auto-top-off Pump, Tesla, HVAC, status
; (both plus a Settings page). Touch calibration is done on-device (first boot,
; or the Settings page's "Recalibrate Touch") and persisted to NVS, so the same
; profile image works on any physical unit.
;
; ALWAYS pick the profile explicitly -- both boards use the same serial port:
;   pio run -e cyd-solar -t upload      pio run -e cyd-fish -t upload
; A bare `pio run` builds both (handy as a check); a bare `pio run -t upload`
; would flash BOTH images one after the other, leaving whichever ran last.

; Settings shared by both profiles.
[env]
platform = espressif32
board = esp32dev
framework = arduino

; Default partition table leaves only ~1.3MB for the app; we have 4MB flash
; and no need for OTA, so use a single large app partition for headroom.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    ; --- TFT_eSPI config for the CYD's ILI9341, set entirely here instead of
    ; --- editing the library's User_Setup.h ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

[env:cyd-solar]
build_flags =
    ${env.build_flags}
    -D CYD_PROFILE_SOLAR=1

[env:cyd-fish]
build_flags =
    ${env.build_flags}
    -D CYD_PROFILE_FISH=1
