; PlatformIO project for the CYD (ESP32-2432S028R, 2.8" resistive touch, dual-USB).
; A home dashboard (clock/weather, forecast, tank temps, auto-top-off pump,
; Tesla, HVAC, system status) plus a Settings page. One firmware image works on any physical
; unit -- touch calibration is done on-device (first boot, or the Settings
; page's "Recalibrate Touch") and persisted to NVS rather than compiled in,
; and there's no other board-specific behavior left to branch on.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino

; Default partition table leaves only ~1.3MB for the app; we have 4MB flash
; and no need for OTA, so use a single large app partition for headroom.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    ; --- TFT_eSPI config for the CYD's ILI9341, set entirely here instead of
    ; --- editing the library's User_Setup.h ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
